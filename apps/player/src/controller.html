<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>MapForge Control</title><style>
body{font-family:system-ui;background:#090d16;color:#edf2ff;margin:0;padding:24px;max-width:700px}h1{font-size:24px}#status{padding:14px;background:#151c2d;border-radius:12px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{font:inherit;font-weight:700;padding:20px;border:0;border-radius:12px;background:#246bfe;color:white}button.stop{background:#d43d51}button.dark{background:#282f40}input{width:100%;margin:24px 0}small{color:#9ca8bf}
</style></head><body><h1>MapForge Live Control</h1><div id="status">Connecting…</div><div class="grid"><button onclick="send('play')">▶ Play</button><button class="dark" onclick="send('pause')">Ⅱ Pause</button><button class="stop" onclick="send('stop')">■ Stop</button><button class="dark" onclick="toggleMute()">Mute / Unmute</button><button class="stop" onclick="send('blackout')">Blackout</button><button onclick="send('restore')">Restore</button></div><label>Master volume</label><input type="range" min="0" max="1" step=".01" value="1" oninput="send('volume/'+this.value)"><small>This page talks only to the Player on your private network.</small><script>
let state={}; async function send(p){await fetch('/api/'+p,{method:'POST'});refresh()} function toggleMute(){send(state.muted?'unmute':'mute')} async function refresh(){try{state=await(await fetch('/api/state')).json();document.querySelector('#status').textContent=`${state.transport.toUpperCase()} · Volume ${Math.round(state.volume*100)}% · ${state.muted?'MUTED':'Audio on'} · ${state.blackout?'BLACKOUT':'Output live'}`}catch(e){document.querySelector('#status').textContent='Player offline'}} setInterval(refresh,1000);refresh();
</script></body></html>
