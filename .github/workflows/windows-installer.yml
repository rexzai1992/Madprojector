name: Windows installer

# Builds MapForge-Setup-<version>.exe on a GitHub Windows machine.
# Download it from the run's "Artifacts" section, or from Releases when a
# tag such as v0.1.0 is pushed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build, test and package
        shell: pwsh
        run: |
          $env:Path += ";${env:ProgramFiles(x86)}\NSIS"
          .\scripts\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MapForge-Setup
          path: dist/MapForge-Setup-*.exe

      # Small: only the MapForge programs, for PCs that already have MapForge.
      - uses: actions/upload-artifact@v4
        with:
          name: MapForge-Update
          path: dist/MapForge-Update-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MapForge-Setup-*.exe
            dist/MapForge-Update-*.exe
