[workspace]
members = ["crates/mapforge-core", "apps/producer", "apps/player"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
eframe = "0.31"
egui = "0.31"
earcutr = "0.4"
image = "0.25"
rfd = "0.15"
rodio = { version = "0.20", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
