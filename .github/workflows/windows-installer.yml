name: Windows installer

# Builds MapForge-Setup-<version>.exe (full) and MapForge-Update-<version>.exe
# (programs only) on a GitHub Windows machine. Every push to main is published
# as release v0.1.<run number>; the apps check the latest release and offer
# the update in a bubble.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build, test and package
        id: build
        shell: pwsh
        run: |
          $env:Path += ";${env:ProgramFiles(x86)}\NSIS"
          .\scripts\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MapForge-Setup
          path: dist/MapForge-Setup-*.exe

      # Small: only the MapForge programs, for PCs that already have MapForge.
      - uses: actions/upload-artifact@v4
        with:
          name: MapForge-Update
          path: dist/MapForge-Update-*.exe

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: MapForge ${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            dist/MapForge-Setup-*.exe
            dist/MapForge-Update-*.exe
