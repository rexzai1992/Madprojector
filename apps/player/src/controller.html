<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MapForge Control</title>
<style>
:root {
  color-scheme: dark;
  --accent: #4c8dff;
  --bg: #07090e;
  --surface: #0f131b;
  --surface-2: #151b26;
  --surface-3: #1c2431;
  --line: #222b3a;
  --line-strong: #324057;
  --text: #f2f5fb;
  --muted: #8b97ab;
  --faint: #5d6a80;
  --live: #2fd38a;
  --danger: #ff4d61;
  --warn: #ffb547;
  --loop: #4fd6c8;
  --columns: 2;
  --radius: 18px;
  --dock: 0px;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
svg { width: 1em; height: 1em; flex: none; }
.hidden { display: none !important; }

/* ---------- layout ---------- */
.app {
  max-width: 1240px;
  margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top)) 16px calc(24px + var(--dock) + env(safe-area-inset-bottom));
  display: grid;
  gap: 14px;
}
.columns { display: grid; gap: 14px; align-items: start; }
.main, .side { display: grid; gap: 14px; min-width: 0; }
@media (min-width: 920px) {
  .app { padding-left: 24px; padding-right: 24px; }
  .columns { grid-template-columns: minmax(0, 1fr) 340px; }
  .side { position: sticky; top: 14px; }
}

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  border-radius: 12px; font-weight: 900; font-size: 14px; letter-spacing: -.06em; color: #fff;
  background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #8a5cff));
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent);
}
.titles { min-width: 0; flex: 1; }
h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#note { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; white-space: pre-wrap; }
.conn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.conn.ok .dot { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent); }
.conn.bad { color: #ffb3bc; border-color: #5a2630; background: #1d1015; }
.conn.bad .dot { background: var(--danger); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.label { margin: 0; color: var(--muted); font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.sub { color: var(--faint); font-size: 12px; }

/* ---------- now playing ---------- */
.now {
  position: relative; overflow: hidden; padding: 18px;
  background:
    radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--scene, var(--accent)) 26%, transparent) 0, transparent 60%),
    var(--surface);
  transition: border-color .3s;
}
.now.is-blackout { border-color: color-mix(in srgb, var(--danger) 60%, var(--line)); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-3); color: var(--muted); border: 1px solid transparent; }
.chip.live { color: #9af0c6; background: color-mix(in srgb, var(--live) 14%, transparent); border-color: color-mix(in srgb, var(--live) 35%, transparent); }
.chip.live .dot { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
.chip.warn { color: #ffd596; background: color-mix(in srgb, var(--warn) 13%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.chip.danger { color: #ffb0ba; background: color-mix(in srgb, var(--danger) 15%, transparent); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.chip.loop { color: #a5f1e9; background: color-mix(in srgb, var(--loop) 13%, transparent); border-color: color-mix(in srgb, var(--loop) 35%, transparent); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
.scene-title { margin: 14px 0 2px; font-size: clamp(26px, 6vw, 40px); font-weight: 850; letter-spacing: -.035em; line-height: 1.05; overflow-wrap: anywhere; }
.scene-meta { color: var(--muted); font-size: 13px; min-height: 18px; }
.timeline { margin-top: 16px; }
.track { position: relative; height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--scene, var(--accent)) 70%, #fff 0%), var(--scene, var(--accent))); }
.times { display: flex; justify-content: space-between; margin-top: 8px; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.times strong { color: var(--text); font-weight: 750; }

/* ---------- buttons ---------- */
.btn {
  appearance: none; border: 1px solid var(--line-strong); background: var(--surface-2);
  border-radius: 14px; min-height: 52px; padding: 0 16px; cursor: pointer; touch-action: manipulation;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  font-weight: 750; font-size: 15px; letter-spacing: -.005em;
  transition: transform .1s ease, background .15s, border-color .15s, box-shadow .15s, opacity .15s;
}
.btn svg { font-size: 20px; }
.btn:hover { border-color: #43536c; }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.stop { color: #ffc1c8; }
.btn.blackout { background: color-mix(in srgb, var(--danger) 16%, var(--surface-2)); border-color: color-mix(in srgb, var(--danger) 50%, transparent); color: #ffd0d6; }
.btn.blackout.on { background: var(--danger); color: #fff; border-color: transparent; box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 25%, transparent); }
.btn.toggle-on { border-color: var(--warn); color: #ffd596; background: color-mix(in srgb, var(--warn) 12%, var(--surface-2)); }
.btn.sending { opacity: .7; }
.transport { display: grid; grid-template-columns: 1.6fr 1fr 1.2fr; gap: 10px; margin-top: 18px; }
.transport .btn { min-height: 64px; font-size: 16px; }
.exit-loop { width: 100%; margin-top: 10px; color: #a5f1e9; border-color: color-mix(in srgb, var(--loop) 45%, transparent); background: color-mix(in srgb, var(--loop) 10%, var(--surface-2)); }

/* ---------- scenes ---------- */
.scenes { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px) { .scenes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 920px) { .scenes { grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); } }
.scene {
  --c: var(--accent);
  position: relative; overflow: hidden; text-align: left; cursor: pointer; touch-action: manipulation;
  min-height: 96px; padding: 14px 14px 16px; border-radius: 16px;
  border: 1px solid var(--line-strong); background: var(--surface-2);
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  transition: transform .1s ease, border-color .15s, background .2s;
}
.scene::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c); opacity: .9; }
.scene:active { transform: scale(.97); }
.scene:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.scene .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.scene .num { font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.scene .key { font-size: 11px; font-weight: 800; color: var(--faint); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; }
.scene .name { font-size: 16px; font-weight: 780; letter-spacing: -.01em; line-height: 1.2; overflow-wrap: anywhere; }
.scene .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--live); }
.scene.live { border-color: var(--live); background: color-mix(in srgb, var(--live) 11%, var(--surface-2)); }
.scene.live .num { color: var(--live); }
.scene.live .num::after { content: " · LIVE"; letter-spacing: .08em; }
.scene.paused { border-color: var(--warn); }
.scene.paused .num { color: var(--warn); }
.scene.paused .num::after { content: " · PAUSED"; letter-spacing: .08em; }
.scene.paused .bar { background: var(--warn); }
.scene.current { border-color: color-mix(in srgb, var(--c) 70%, var(--line-strong)); }

.pads { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.pad {
  --c: var(--warn);
  display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; touch-action: manipulation;
  min-height: 54px; padding: 10px 12px; border-radius: 14px;
  border: 1px solid var(--line-strong); background: var(--surface-2); font-weight: 720; font-size: 14px;
  transition: transform .1s ease, border-color .15s;
}
.pad:active { transform: scale(.97); }
.pad .ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); font-size: 15px; }
.pad.loop { --c: var(--loop); }
.pad.live { border-color: var(--loop); background: color-mix(in srgb, var(--loop) 10%, var(--surface-2)); }
.pad .txt { min-width: 0; overflow-wrap: anywhere; }
.pad small { display: block; color: var(--faint); font-size: 11px; font-weight: 600; }
.empty { color: var(--faint); font-size: 13px; padding: 6px 2px; }

/* ---------- side panel ---------- */
.out-row { display: grid; grid-template-columns: 1fr; gap: 10px; }
.out-row .btn { min-height: 58px; }
.volume { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.icon-btn { width: 44px; min-width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 12px; }
.volume-value { width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 750; font-size: 14px; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 44px; background: transparent; cursor: pointer; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--accent) var(--pct, 100%), var(--surface-3) var(--pct, 100%)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: var(--surface-3); }
input[type=range]::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 8px #0008; }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 8px #0008; }
input[type=range].muted::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--faint) var(--pct, 100%), var(--surface-3) var(--pct, 100%)); }

.pcs { display: grid; gap: 8px; }
.pc { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; }
.pc .name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc .role { color: var(--faint); font-size: 12px; font-weight: 700; }
.pc .dot { width: 9px; height: 9px; }
.pc.on .dot { background: var(--live); }
.pc.off { border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.pc.off .dot { background: var(--danger); }
.pc.off .role { color: #ffb0ba; }

details.card { padding: 0; }
details.card > summary { list-style: none; cursor: pointer; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary .chev { transition: transform .2s; color: var(--muted); font-size: 18px; }
details.card[open] > summary .chev { transform: rotate(90deg); }
.details-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.hint { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.proj { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.proj .n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; font-weight: 850; color: #fff; background: var(--accent); }
.proj .info { flex: 1; min-width: 0; }
.proj .info strong { display: block; font-size: 13.5px; overflow-wrap: anywhere; }
.proj .info span { display: block; color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.proj .btn { width: 40px; min-width: 40px; min-height: 40px; height: 40px; padding: 0; border-radius: 10px; }

.footer { text-align: center; color: var(--faint); font-size: 11.5px; padding-top: 4px; }

/* ---------- phone dock ---------- */
.dock { display: none; }
@media (max-width: 919px) {
  :root { --dock: 86px; }
  .dock {
    position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: 1.5fr 1fr 1.25fr; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border-top: 1px solid var(--line);
  }
  .dock .btn { min-height: 60px; font-size: 15px; }
  .now .transport { display: none; }
  .side .output-card .out-row { display: none; }
}
@media (max-width: 380px) {
  .app { padding-left: 10px; padding-right: 10px; }
  .card { padding: 13px; }
  .scene { min-height: 84px; padding: 12px 12px 14px; }
  .scene .name { font-size: 15px; }
  .dock .btn svg { display: none; }
}

/* ---------- toast ---------- */
.toast {
  position: fixed; z-index: 30; left: 50%; bottom: calc(var(--dock) + 18px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: min(92vw, 460px); padding: 11px 16px; border-radius: 12px;
  background: #2a1218; border: 1px solid #6b2a36; color: #ffd0d6; font-size: 13.5px; font-weight: 650;
  box-shadow: 0 12px 40px #000a; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.3v13.4a1 1 0 0 0 1.52.85l10.7-6.7a1 1 0 0 0 0-1.7L9.52 4.45A1 1 0 0 0 8 5.3z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" x="6" y="5" width="4.5" height="14" rx="1.3"/><rect fill="currentColor" x="13.5" y="5" width="4.5" height="14" rx="1.3"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect fill="currentColor" x="6" y="6" width="12" height="12" rx="2.2"/></symbol>
  <symbol id="i-blackout" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M3 3l18 18"/></g></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></g></symbol>
  <symbol id="i-exit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g></symbol>
  <symbol id="i-cue" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l9 9-9 9-9-9z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand" aria-hidden="true">MF</div>
    <div class="titles">
      <h1 id="title">MapForge Live Control</h1>
      <p id="note" class="hidden"></p>
    </div>
    <span id="conn" class="conn"><span class="dot"></span><span id="conn-text">Connecting</span></span>
  </header>

  <div class="columns">
    <main class="main">
      <section id="now" class="card now" aria-live="polite">
        <div class="chips" id="chips"></div>
        <div class="scene-title" id="scene-title">Connecting…</div>
        <div class="scene-meta" id="scene-meta"></div>
        <div class="timeline">
          <div class="track" role="progressbar" aria-label="Scene position" aria-valuemin="0" aria-valuemax="100" id="track"><div class="fill" id="fill"></div></div>
          <div class="times"><strong id="t-pos">0:00</strong><span id="t-left">−0:00</span></div>
        </div>
        <div class="transport" id="transport">
          <button class="btn primary" data-play><svg><use href="#i-play"/></svg><span>Play</span></button>
          <button class="btn stop" data-stop><svg><use href="#i-stop"/></svg><span>Stop</span></button>
          <button class="btn blackout" data-blackout><svg><use href="#i-blackout"/></svg><span>Blackout</span></button>
        </div>
        <button class="btn exit-loop hidden" id="exit-loop"><svg><use href="#i-exit"/></svg><span id="exit-loop-text">Exit loop</span></button>
      </section>

      <section class="card" id="scenes-card">
        <div class="card-head"><h2 class="label">Scenes</h2><span class="sub" id="scenes-count"></span></div>
        <div class="scenes" id="scenes"></div>
      </section>

      <section class="card hidden" id="cues-card">
        <div class="card-head"><h2 class="label" id="cues-title">Cues &amp; loops</h2></div>
        <div class="pads" id="pads"></div>
      </section>
    </main>

    <aside class="side">
      <section class="card output-card" id="output-card">
        <div class="card-head"><h2 class="label">Output</h2><span class="sub" id="out-sub"></span></div>
        <div class="out-row" id="out-row">
          <button class="btn blackout" data-blackout><svg><use href="#i-blackout"/></svg><span>Blackout</span></button>
        </div>
        <div class="volume" id="volume-row">
          <button class="btn icon-btn" id="mute" aria-label="Mute"><svg><use href="#i-vol"/></svg></button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Master volume">
          <span class="volume-value" id="volume-value">100%</span>
        </div>
      </section>

      <section class="card hidden" id="pcs-card">
        <div class="card-head"><h2 class="label">Player PCs</h2><span class="sub" id="pcs-sub"></span></div>
        <div class="pcs" id="pcs"></div>
      </section>

      <details class="card hidden" id="setup-card">
        <summary><h2 class="label">Projector setup</h2><svg class="chev"><use href="#i-chev"/></svg></summary>
        <div class="details-body">
          <p class="hint">Show the numbers on the projectors, then put them in the order they hang, left to right.</p>
          <button class="btn" id="identify">Show projector numbers</button>
          <div id="projectors" class="pcs"></div>
        </div>
      </details>

      <div class="footer">MapForge · on this show network only</div>
    </aside>
  </div>
</div>

<nav class="dock" id="dock" aria-label="Show controls">
  <button class="btn primary" data-play><svg><use href="#i-play"/></svg><span>Play</span></button>
  <button class="btn stop" data-stop><svg><use href="#i-stop"/></svg><span>Stop</span></button>
  <button class="btn blackout" data-blackout><svg><use href="#i-blackout"/></svg><span>Blackout</span></button>
</nav>

<div class="toast" id="toast" role="alert"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const $$ = (sel) => [...document.querySelectorAll(sel)];
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rgb = (c) => Array.isArray(c) && c.length === 3 ? `rgb(${c[0]},${c[1]},${c[2]})` : null;
const clock = (s) => {
  s = Math.max(0, Math.floor(Number(s) || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
};
const icon = (name) => `<svg><use href="#i-${name}"/></svg>`;

let state = null;
let controller = { settings: {}, scenes: [] };
let projectors = { outputs: [] };
let online = false;
let stamp = { pos: 0, at: performance.now() };
let draggingVolume = false;
let lastVolumeTouch = 0;
let scenesSig = '', padsSig = '', projSig = '', pcsSig = '';

/* ---------- requests ---------- */
let toastTimer;
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (_) {} }

async function post(path, body, button) {
  buzz();
  button?.classList.add('sending');
  try {
    const init = { method: 'POST', cache: 'no-store' };
    if (body !== undefined) { init.headers = { 'Content-Type': 'application/json' }; init.body = JSON.stringify(body); }
    const r = await fetch('/api/' + path, init);
    if (!r.ok) throw new Error((await r.text()) || `The Player refused that (${r.status}).`);
    await refresh();
  } catch (e) {
    toast(e.message && e.message !== 'Failed to fetch' ? e.message : 'Could not reach the Player. Check the Wi-Fi.');
  } finally {
    button?.classList.remove('sending');
  }
}

/* ---------- actions ---------- */
const playing = () => state?.transport === 'playing';
function togglePlay(btn) { post(playing() ? 'pause' : 'play', undefined, btn); }
function stopShow(btn) { post('stop', undefined, btn); }
function toggleBlackout(btn) { post(state?.blackout ? 'restore' : 'blackout', undefined, btn); }

$$('[data-play]').forEach((b) => b.addEventListener('click', () => togglePlay(b)));
$$('[data-stop]').forEach((b) => b.addEventListener('click', () => stopShow(b)));
$$('[data-blackout]').forEach((b) => b.addEventListener('click', () => toggleBlackout(b)));
$('exit-loop').addEventListener('click', (e) => post('release', undefined, e.currentTarget));
$('mute').addEventListener('click', (e) => post(state?.muted ? 'unmute' : 'mute', undefined, e.currentTarget));
$('identify').addEventListener('click', (e) => { projSig = ''; post('calibration', undefined, e.currentTarget); });

$('scenes').addEventListener('click', (e) => {
  const b = e.target.closest('[data-scene]');
  if (b) post('scene/' + b.dataset.scene, undefined, b);
});
$('pads').addEventListener('click', (e) => {
  const b = e.target.closest('[data-pad]');
  if (b) post(b.dataset.pad, undefined, b);
});
$('projectors').addEventListener('click', (e) => {
  const b = e.target.closest('[data-move]');
  if (!b) return;
  const ordered = [...(projectors.outputs || [])].sort((a, c) => a.position - c.position);
  const i = ordered.findIndex((o) => o.id === b.dataset.id);
  const j = i + Number(b.dataset.move);
  if (i < 0 || j < 0 || j >= ordered.length) return;
  [ordered[i], ordered[j]] = [ordered[j], ordered[i]];
  projSig = '';
  post('projector-order', { order: ordered.map((o) => o.id) }, b);
});

/* volume: live label while dragging, send when released and every 150 ms while moving */
const vol = $('volume');
let volTimer = null;
function paintVolume(v, muted) {
  vol.style.setProperty('--pct', Math.round(v * 100) + '%');
  vol.classList.toggle('muted', !!muted);
  $('volume-value').textContent = muted ? 'Muted' : Math.round(v * 100) + '%';
}
function sendVolume() { fetch(`/api/volume/${Number(vol.value).toFixed(2)}`, { method: 'POST', cache: 'no-store' }).catch(() => {}); }
vol.addEventListener('pointerdown', () => { draggingVolume = true; });
vol.addEventListener('input', () => {
  lastVolumeTouch = Date.now();
  paintVolume(Number(vol.value), false);
  if (!volTimer) volTimer = setTimeout(() => { volTimer = null; sendVolume(); }, 150);
});
vol.addEventListener('change', () => { draggingVolume = false; lastVolumeTouch = Date.now(); clearTimeout(volTimer); volTimer = null; sendVolume(); });
window.addEventListener('pointerup', () => { draggingVolume = false; });

/* keyboard (PC or tablet with keyboard) */
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input') || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
  const key = e.key.toLowerCase();
  if (key === 'b') { toggleBlackout(); return; }
  const scene = (controller.scenes || []).find((s) => (s.hotkey || '').toLowerCase() === key);
  // Scene hotkeys are often F-keys; keep the browser from reloading or searching.
  if (scene) { e.preventDefault(); post('scene/' + scene.index); }
});

/* ---------- rendering ---------- */
function setButtons() {
  const isPlaying = playing();
  $$('[data-play]').forEach((b) => {
    b.innerHTML = isPlaying ? `${icon('pause')}<span>Pause</span>` : `${icon('play')}<span>${state?.transport === 'paused' ? 'Resume' : 'Play'}</span>`;
    b.classList.toggle('primary', true);
  });
  $$('[data-blackout]').forEach((b) => {
    const on = !!state?.blackout;
    b.classList.toggle('on', on);
    b.innerHTML = on ? `${icon('restore')}<span>Restore</span>` : `${icon('blackout')}<span>Blackout</span>`;
    b.setAttribute('aria-pressed', String(on));
  });
  const muted = !!state?.muted;
  $('mute').innerHTML = icon(muted ? 'mute' : 'vol');
  $('mute').classList.toggle('toggle-on', muted);
  $('mute').setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
}

function renderNow() {
  const s = state || {};
  const current = controller.current_scene;
  const live = (controller.scenes || []).find((x) => x.id === s.scene_id);
  const tint = rgb(live?.color);
  const now = $('now');
  if (tint) now.style.setProperty('--scene', tint); else now.style.removeProperty('--scene');
  now.classList.toggle('is-blackout', !!s.blackout);

  const chips = [];
  if (!online) chips.push(`<span class="chip danger"><span class="dot"></span>Offline</span>`);
  else if (s.transport === 'playing') chips.push(`<span class="chip live"><span class="dot"></span>Live</span>`);
  else if (s.transport === 'paused') chips.push(`<span class="chip warn">Paused</span>`);
  else if (s.transport === 'ready') chips.push(`<span class="chip warn">Starting…</span>`);
  else chips.push(`<span class="chip">Stopped</span>`);
  if (s.blackout) chips.push(`<span class="chip danger">Blackout</span>`);
  if (s.loop_name) chips.push(`<span class="chip loop">${icon('loop')} ${esc(s.loop_name)}</span>`);
  if (s.muted) chips.push(`<span class="chip warn">${icon('mute')} Muted</span>`);
  $('chips').innerHTML = chips.join('');

  $('scene-title').textContent = online ? (current?.label || 'No scene') : 'Player offline';
  const followers = s.followers || [];
  const down = followers.filter((f) => !f.online);
  $('scene-meta').textContent = !online ? 'Reconnecting…'
    : down.length ? `${down.length} Player PC${down.length > 1 ? 's' : ''} offline`
    : followers.length ? `${followers.length + 1} Player PCs ${s.transport === 'playing' ? 'in sync' : 'online'}` : '';
  $('exit-loop').classList.toggle('hidden', !s.loop_name);
  $('exit-loop-text').textContent = s.loop_name ? `Exit loop · ${s.loop_name}` : 'Exit loop';
}

function renderScenes() {
  const scenes = controller.scenes || [];
  const sig = JSON.stringify([scenes.map((s) => [s.id, s.label, s.color, s.hotkey]), state?.scene_id, state?.transport]);
  $('scenes-count').textContent = scenes.length ? `${scenes.length} scene${scenes.length > 1 ? 's' : ''}` : '';
  if (sig === scenesSig) return;
  scenesSig = sig;
  $('scenes').innerHTML = scenes.length ? scenes.map((s, i) => {
    const c = rgb(s.color);
    const live = s.id === state?.scene_id;
    const look = !live ? '' : state?.transport === 'playing' ? ' live' : state?.transport === 'paused' ? ' paused' : ' current';
    return `<button class="scene${look}" data-scene="${s.index}" ${c ? `style="--c:${c}"` : ''}>` +
      `<span class="top"><span class="num">${String(i + 1).padStart(2, '0')}</span>${s.hotkey ? `<span class="key">${esc(s.hotkey)}</span>` : ''}</span>` +
      `<span class="name">${esc(s.label)}</span>${live ? '<span class="bar" id="scene-bar"></span>' : ''}</button>`;
  }).join('') : '<div class="empty">No scenes in this show yet.</div>';
}

function renderPads() {
  const scenes = controller.scenes || [];
  const live = scenes.find((s) => s.id === state?.scene_id);
  // The playing scene's cues and loops first; with nothing playing, all of them.
  const list = live ? [live] : scenes;
  const many = list.length > 1;
  const pads = list.flatMap((s) => [
    ...(s.cues || []).map((c) => ({ path: `cue/${s.index}/${c.index}`, label: c.label, color: c.color, scene: s.label, kind: 'cue', live: false })),
    ...(s.loops || []).map((l) => ({ path: `loop/${s.index}/${l.index}`, label: l.label, color: l.color, scene: s.label, kind: 'loop', live: state?.scene_id === s.id && state?.loop_name === (l.name || l.label) })),
  ]);
  const sig = JSON.stringify([pads, many]);
  $('cues-card').classList.toggle('hidden', pads.length === 0 || controller.settings?.show_scenes === false);
  $('cues-title').textContent = live ? `Cues & loops · ${live.label}` : 'Cues & loops';
  if (sig === padsSig) return;
  padsSig = sig;
  $('pads').innerHTML = pads.map((p) => {
    const c = rgb(p.color);
    return `<button class="pad ${p.kind}${p.live ? ' live' : ''}" data-pad="${p.path}" ${c ? `style="--c:${c}"` : ''}>` +
      `<span class="ic">${icon(p.kind === 'loop' ? 'loop' : 'cue')}</span><span class="txt">${esc(p.label)}${many ? `<small>${esc(p.scene)}</small>` : ''}</span></button>`;
  }).join('');
}

function renderSide() {
  const s = state || {};
  if (!draggingVolume && Date.now() - lastVolumeTouch > 1500) vol.value = s.volume ?? 1;
  paintVolume(Number(vol.value), !!s.muted);
  $('out-sub').textContent = s.blackout ? 'Projectors dark' : 'Projectors live';

  const followers = s.followers || [];
  $('pcs-card').classList.toggle('hidden', followers.length === 0);
  const sig = JSON.stringify(followers) + online;
  if (sig !== pcsSig) {
    pcsSig = sig;
    const row = (name, role, on) => `<div class="pc ${on ? 'on' : 'off'}"><span class="dot"></span><span class="name">${esc(name)}</span><span class="role">${role}${on ? '' : ' · offline'}</span></div>`;
    const here = /^(127\.|localhost$|\[?::1)/.test(location.hostname) ? 'This PC' : location.hostname;
    $('pcs').innerHTML = row(here, 'Master', online) + followers.map((f) => row(f.address.split(':')[0], 'Sub', f.online)).join('');
    const up = followers.filter((f) => f.online).length + (online ? 1 : 0);
    $('pcs-sub').textContent = `${up}/${followers.length + 1} online`;
  }

  const outputs = projectors.outputs || [];
  $('setup-card').classList.toggle('hidden', outputs.length === 0);
  const psig = JSON.stringify([outputs, projectors.identifying]);
  if (psig !== projSig) {
    projSig = psig;
    $('identify').textContent = projectors.identifying ? 'Hide projector numbers' : 'Show projector numbers';
    $('identify').classList.toggle('toggle-on', !!projectors.identifying);
    const ordered = [...outputs].sort((a, b) => a.position - b.position);
    $('projectors').innerHTML = ordered.map((o, i) =>
      `<div class="proj"><span class="n">${i + 1}</span><div class="info"><strong>${esc(o.name)}</strong><span>Output #${o.number} · X ${Math.round(o.x)} · Y ${Math.round(o.y)}</span></div>` +
      `<button class="btn" data-move="-1" data-id="${o.id}" aria-label="Move ${esc(o.name)} left" ${i === 0 ? 'disabled' : ''}>${icon('left')}</button>` +
      `<button class="btn" data-move="1" data-id="${o.id}" aria-label="Move ${esc(o.name)} right" ${i === ordered.length - 1 ? 'disabled' : ''}>${icon('chev')}</button></div>`
    ).join('');
  }
}

function applySettings() {
  const st = controller.settings || {};
  document.title = st.title || 'MapForge Control';
  $('title').textContent = st.title || 'MapForge Live Control';
  $('note').textContent = st.note || '';
  $('note').classList.toggle('hidden', !st.note);
  const accent = rgb(st.accent);
  if (accent) document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--columns', Math.max(1, Math.min(4, st.columns || 2)));
  const showTransport = st.show_transport !== false;
  $('transport').classList.toggle('hidden', !showTransport);
  $$('[data-play], [data-stop]').forEach((b) => b.classList.toggle('hidden', !showTransport));
  $$('[data-blackout]').forEach((b) => b.classList.toggle('hidden', st.show_blackout === false));
  $('out-row').classList.toggle('hidden', st.show_blackout === false);
  $('volume-row').classList.toggle('hidden', st.show_volume === false);
  $('output-card').classList.toggle('hidden', st.show_blackout === false && st.show_volume === false);
  $('scenes-card').classList.toggle('hidden', st.show_scenes === false);
  const dockEmpty = !showTransport && st.show_blackout === false;
  $('dock').classList.toggle('hidden', dockEmpty);
  document.documentElement.style.setProperty('--dock', dockEmpty ? '0px' : '');
}

function setConnection(ok) {
  online = ok;
  $('conn').className = 'conn ' + (ok ? 'ok' : 'bad');
  $('conn-text').textContent = ok ? (state?.role === 'sub' ? 'Sub Player' : 'Connected') : 'Offline';
}

/* ---------- smooth playhead between polls ---------- */
function position(at) {
  if (!state) return 0;
  let p = stamp.pos;
  if (state.transport === 'playing') p += (at - stamp.at) / 1000;
  const d = Number(controller.current_scene?.duration_seconds) || 0;
  if (d > 0 && !state.loop_name) p = Math.min(p, d);
  return Math.max(0, p);
}
function paintTimeline(t) {
  const d = Number(controller.current_scene?.duration_seconds) || 0;
  const p = position(t);
  const pct = d > 0 ? Math.min(100, (p / d) * 100) : 0;
  $('fill').style.width = pct + '%';
  $('track').setAttribute('aria-valuenow', String(Math.round(pct)));
  $('t-pos').textContent = clock(p);
  $('t-left').textContent = d > 0 ? '−' + clock(Math.max(0, d - p)) : clock(0);
  const bar = $('scene-bar');
  if (bar) bar.style.width = pct + '%';
}
let lastPaint = 0;
function frame(t) {
  if (t - lastPaint > 90) { lastPaint = t; paintTimeline(t); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- polling ---------- */
let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    const opts = { cache: 'no-store' };
    const [a, b, c] = await Promise.all([fetch('/api/state', opts), fetch('/api/controller', opts), fetch('/api/projectors', opts)]);
    if (!a.ok || !b.ok || !c.ok) throw new Error('unavailable');
    const [ns, nc, np] = await Promise.all([a.json(), b.json(), c.json()]);
    state = ns; controller = nc; projectors = np;
    stamp = { pos: Number(ns.position_seconds) || 0, at: performance.now() };
    setConnection(true);
  } catch (_) {
    setConnection(false);
  } finally {
    refreshing = false;
  }
  applySettings();
  setButtons();
  renderNow();
  renderScenes();
  renderPads();
  renderSide();
  paintTimeline(performance.now());
}
setInterval(refresh, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
refresh();
</script>
</body>
</html>
